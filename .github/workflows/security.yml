name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [mouad, haytham, main]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: frontend
            working_directory: MUS-frontend
          - name: backend
            working_directory: MUS-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.working_directory }}/package-lock.json

      - name: Install dependencies (${{ matrix.name }})
        working-directory: ${{ matrix.working_directory }}
        run: npm ci

      - name: Run npm audit (${{ matrix.name }})
        working-directory: ${{ matrix.working_directory }}
        continue-on-error: true
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
