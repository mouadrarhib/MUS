name: Docker Publish

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image for scan
        uses: docker/build-push-action@v6
        with:
          context: ./MUS-backend
          push: false
          load: true
          tags: mus-backend:scan

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: mus-backend:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Build frontend image for scan
        uses: docker/build-push-action@v6
        with:
          context: ./MUS-frontend
          push: false
          load: true
          tags: mus-frontend:scan

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: mus-frontend:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./MUS-backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mus-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./MUS-frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mus-frontend:latest
